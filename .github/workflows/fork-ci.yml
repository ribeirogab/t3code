name: Fork CI

on:
  pull_request:
    branches:
      - custom

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-changed:
    name: Check changed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Check changed files
        run: vp run check:changed "origin/${{ github.base_ref }}"
